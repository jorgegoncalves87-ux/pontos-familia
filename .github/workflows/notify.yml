name: Notificações

# Corre a cada 10 minutos (o GitHub pode atrasar alguns minutos) e envia as notificações push.
# Precisa do segredo FIREBASE_SERVICE_ACCOUNT (Settings → Secrets and variables → Actions).
on:
  schedule:
    - cron: "3-59/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: notifier/package-lock.json
      - run: npm ci --prefix notifier --no-audit --no-fund
      - run: node notifier/notify.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      # O GitHub desliga agendamentos de repositórios sem atividade há 60 dias; uma vez por semana
      # voltamos a ativar este workflow para isso não acontecer.
      - name: Manter o agendamento ativo
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%u%H%M)" \< "10010" ]; then
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/notify.yml/enable" || true
          fi
        env:
          GH_TOKEN: ${{ github.token }}
